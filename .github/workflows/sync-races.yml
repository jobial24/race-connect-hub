name: Zero-Touch Cloudflare D1 Race Sync

on:
  schedule:
    - cron: '0 */6 * * *' # Cada 6 horas
  workflow_dispatch:

jobs:
  trigger-cloudflare-d1-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Disparar sincronización en Cloudflare Pages D1
        run: |
          curl -f -X POST "https://race-connect-hub.pages.dev/api/sync-races" \
            -H "Content-Type: application/json"